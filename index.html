<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Payroll Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Mobile Touch Tweaks */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .tap-highlight-transparent { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24 select-none">

  <!-- TOP APP BAR -->
  <header class="bg-indigo-900 text-white sticky top-0 z-30 shadow-md">
    <div class="px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-users-gear text-indigo-400 text-lg"></i>
        <h1 class="font-bold text-base tracking-wide">Daily Payroll</h1>
      </div>
      <div class="flex items-center gap-1.5">
        <input type="date" id="selectedDate" onchange="changeDate()" 
               class="bg-indigo-950 text-indigo-100 text-xs font-semibold px-2 py-1.5 rounded-lg border border-indigo-700 outline-none">
      </div>
    </div>

    <!-- SUMMARY PILL -->
    <div class="bg-indigo-800/80 px-4 py-2 flex justify-between items-center text-xs border-t border-indigo-700">
      <span>Daily Total: <strong id="headerDayTotal" class="text-emerald-300 text-sm">₹0.00</strong></span>
      <span id="activeWorkersCount" class="text-indigo-200">0 Active Workers</span>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="p-3 max-w-lg mx-auto">

    <!-- VIEW 1: DAILY CARDS (MOBILE FIRST) -->
    <section id="view-entry" class="space-y-3">
      <div id="workersCardList" class="space-y-2.5">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- VIEW 2: MONTHLY SUMMARY -->
    <section id="view-summary" class="hidden space-y-4">
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm space-y-3">
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="text-slate-500 font-medium">From Date:</label>
            <input type="date" id="sumFromDate" class="w-full mt-1 border border-slate-300 rounded p-1.5 font-medium">
          </div>
          <div>
            <label class="text-slate-500 font-medium">To Date:</label>
            <input type="date" id="sumToDate" class="w-full mt-1 border border-slate-300 rounded p-1.5 font-medium">
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="renderMonthlySummary()" class="flex-1 bg-indigo-600 text-white font-medium text-xs py-2 rounded-lg shadow">
            Filter Report
          </button>
          <button onclick="exportCSV()" class="bg-emerald-600 text-white px-3 py-2 rounded-lg text-xs font-medium">
            <i class="fa-solid fa-file-excel mr-1"></i> CSV
          </button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-[11px] text-slate-400 font-bold uppercase">Total Payout</div>
          <div class="text-lg font-black text-indigo-700 mt-0.5" id="sumTotalPayout">₹0</div>
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-[11px] text-slate-400 font-bold uppercase">Total Roj (Days)</div>
          <div class="text-lg font-black text-emerald-600 mt-0.5" id="sumTotalRoj">0</div>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div class="p-3 border-b border-slate-100 font-bold text-xs text-slate-700 flex justify-between">
          <span>Worker Breakdown</span>
          <span>Net Amount</span>
        </div>
        <div id="summaryList" class="divide-y divide-slate-100 text-xs">
          <!-- Injected via JS -->
        </div>
      </div>
    </section>

    <!-- VIEW 3: RATE SETTINGS -->
    <section id="view-rates" class="hidden">
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm space-y-3">
        <div class="flex items-center justify-between pb-2 border-b border-slate-100">
          <h2 class="font-bold text-sm">Item Master Rates (₹)</h2>
          <button onclick="saveRatesFromUI()" class="bg-emerald-600 text-white px-3 py-1 text-xs rounded-lg font-medium">
            Save Rates
          </button>
        </div>
        <div class="space-y-2 text-xs" id="ratesInputsList">
          <!-- Injected via JS -->
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL: WORKER ENTRY POPUP SHEET (MOBILE MODAL) -->
  <div id="workerEntryModal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col justify-end">
    <div class="bg-white rounded-t-2xl max-h-[88vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
      
      <!-- MODAL HEADER -->
      <div class="p-3.5 bg-indigo-900 text-white flex items-center justify-between">
        <div>
          <span class="text-[10px] text-indigo-300 uppercase tracking-wider font-semibold">Worker Entry</span>
          <h3 class="font-bold text-base leading-tight" id="modalWorkerName">WORKER NAME</h3>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-indigo-300 font-semibold">Total ₹</div>
          <div class="text-base font-black text-emerald-300" id="modalRunningTotal">₹0.00</div>
        </div>
      </div>

      <!-- MODAL SCROLLABLE WORK ITEMS -->
      <div class="p-3 overflow-y-auto space-y-2.5 flex-1" id="modalItemsList">
        <!-- 13 Work Items Injected via JS -->
      </div>

      <!-- MODAL FOOTER -->
      <div class="p-3 bg-slate-50 border-t border-slate-200 flex gap-2">
        <button onclick="closeWorkerModal()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition">
          Close
        </button>
        <button onclick="saveCurrentWorkerModal()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition">
          Save & Done
        </button>
      </div>

    </div>
  </div>

  <!-- BOTTOM MOBILE NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 px-1 z-40 text-[11px] shadow-lg">
    <button onclick="switchView('entry')" id="nav-entry" class="flex-1 flex flex-col items-center py-1 text-indigo-600 font-bold">
      <i class="fa-solid fa-list-check text-base mb-0.5"></i> Daily Entry
    </button>
    <button onclick="switchView('summary')" id="nav-summary" class="flex-1 flex flex-col items-center py-1 text-slate-400 font-medium">
      <i class="fa-solid fa-chart-simple text-base mb-0.5"></i> Report
    </button>
    <button onclick="switchView('rates')" id="nav-rates" class="flex-1 flex flex-col items-center py-1 text-slate-400 font-medium">
      <i class="fa-solid fa-sliders text-base mb-0.5"></i> Rates
    </button>
  </nav>

  <script>
    // 1. WORKERS LIST
    const WORKERS = [
      "LALO", "JAYESH", "NATU P", "HITESH", "KANU", "MAHESH C", 
      "NATUBHAI", "RAMSINGH", "SHAILESH", "KABO", "MAHESH", 
      "RAJU", "BHARAT", "NILESH", "AMIT", "VIJAY"
    ];

    // 2. WORK ITEMS IN YOUR EXACT ORDER
    const WORK_ITEMS = [
      { id: "aatho_n", name: "Aatho N", rate: 135.00, step: 1 },
      { id: "aatho_b", name: "Aatho B", rate: 135.00, step: 1 },
      { id: "aatho_s", name: "Aatho S", rate: 290.00, step: 1 },
      { id: "roj", name: "Roj", rate: 270.00, step: 0.5 },
      { id: "bag_20k_patti", name: "20 kg Bag Patti", rate: 19.00, step: 1 },
      { id: "bag_20k_pouch", name: "20 kg Bag Pouch", rate: 18.00, step: 1 },
      { id: "bandha_5", name: "5/- Bandha", rate: 25.00, step: 1 },
      { id: "pouch_5", name: "5/- Pouch Bag", rate: 17.00, step: 1 },
      { id: "bandha_10", name: "10/- Bandha", rate: 32.00, step: 1 },
      { id: "pouch_10", name: "10/- Pouch Bag", rate: 17.00, step: 1 },
      { id: "bundle_40k", name: "40 kg Bundle", rate: 60.00, step: 1 },
      { id: "box", name: "Box", rate: 125.00, step: 1 },
      { id: "ghoda", name: "Ghoda", rate: 60.00, step: 1 }
    ];

    let itemRates = {};
    let records = {}; // { date: { worker: { itemId: count } } }
    let activeWorker = null;

    window.addEventListener("DOMContentLoaded", () => {
      initStorage();

      const today = new Date().toISOString().split("T")[0];
      document.getElementById("selectedDate").value = today;

      const now = new Date();
      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split("T")[0];
      document.getElementById("sumFromDate").value = firstDay;
      document.getElementById("sumToDate").value = today;

      renderWorkerCards();
      renderRatesUI();
      updateDayHeaderSummary();
    });

    function initStorage() {
      const savedRates = localStorage.getItem("mob_payroll_rates");
      if (savedRates) {
        itemRates = JSON.parse(savedRates);
      } else {
        itemRates = {};
        WORK_ITEMS.forEach(it => { itemRates[it.id] = it.rate; });
        localStorage.setItem("mob_payroll_rates", JSON.stringify(itemRates));
      }

      const savedRecords = localStorage.getItem("mob_payroll_records");
      if (savedRecords) records = JSON.parse(savedRecords);
    }

    function saveRecords() {
      localStorage.setItem("mob_payroll_records", JSON.stringify(records));
      updateDayHeaderSummary();
    }

    function changeDate() {
      renderWorkerCards();
      updateDayHeaderSummary();
    }

    // WORKER LIST CARDS
    function renderWorkerCards() {
      const dt = document.getElementById("selectedDate").value;
      const dayData = records[dt] || {};
      const list = document.getElementById("workersCardList");
      list.innerHTML = "";

      WORKERS.forEach((w, index) => {
        const wData = dayData[w] || {};
        let totalWage = 0;
        let summaryItems = [];

        WORK_ITEMS.forEach(item => {
          const qty = wData[item.id] || 0;
          if (qty > 0) {
            totalWage += (qty * (itemRates[item.id] || 0));
            summaryItems.push(`${item.name}: ${qty}`);
          }
        });

        const hasEntry = summaryItems.length > 0;

        const card = document.createElement("div");
        card.className = `p-3 rounded-xl border flex items-center justify-between transition active:scale-[0.99] cursor-pointer ${
          hasEntry ? "bg-white border-indigo-200 shadow-sm" : "bg-slate-50 border-slate-200 text-slate-400"
        }`;
        card.onclick = () => openWorkerModal(w);

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${
              hasEntry ? "bg-indigo-100 text-indigo-700" : "bg-slate-200 text-slate-500"
            }">
              ${index + 1}
            </div>
            <div>
              <div class="font-bold text-sm ${hasEntry ? "text-slate-800" : "text-slate-600"}">${w}</div>
              <div class="text-[11px] text-slate-500 truncate max-w-[190px]">
                ${hasEntry ? summaryItems.join(", ") : "કોઈ એન્ટ્રી નથી - ક્લિક કરો"}
              </div>
            </div>
          </div>
          <div class="text-right">
            <div class="font-black text-sm ${hasEntry ? "text-indigo-700" : "text-slate-300"}">
              ₹${totalWage.toFixed(2)}
            </div>
            <div class="text-[10px] text-indigo-500 font-semibold mt-0.5">
              Edit <i class="fa-solid fa-angle-right"></i>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // MODAL OPEN / CALC
    function openWorkerModal(workerName) {
      activeWorker = workerName;
      document.getElementById("modalWorkerName").innerText = workerName;
      const dt = document.getElementById("selectedDate").value;
      const wData = (records[dt] && records[dt][workerName]) ? records[dt][workerName] : {};

      const list = document.getElementById("modalItemsList");
      list.innerHTML = "";

      WORK_ITEMS.forEach(item => {
        const currentQty = wData[item.id] || "";
        const rate = itemRates[item.id] || 0;

        const row = document.createElement("div");
        row.className = "flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-200";
        row.innerHTML = `
          <div class="flex-1 pr-2">
            <div class="font-bold text-xs text-slate-800">${item.name}</div>
            <div class="text-[10px] text-slate-400">₹${rate.toFixed(2)}</div>
          </div>

          <div class="flex items-center gap-1.5">
            <button type="button" onclick="adjustModalQty('${item.id}', -${item.step})" 
                    class="w-8 h-8 rounded-lg bg-slate-200 text-slate-700 font-bold active:bg-slate-300 flex items-center justify-center">
              -
            </button>

            <input type="number" step="${item.step}" min="0" id="modal-inp-${item.id}" value="${currentQty}" 
                   placeholder="0" oninput="calcModalRunningTotal()"
                   class="w-16 h-8 text-center font-bold text-xs border border-slate-300 rounded-lg bg-white outline-none focus:border-indigo-500">

            <button type="button" onclick="adjustModalQty('${item.id}', ${item.step})" 
                    class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-700 font-bold active:bg-indigo-200 flex items-center justify-center">
              +
            </button>
          </div>
        `;
        list.appendChild(row);
      });

      calcModalRunningTotal();
      document.getElementById("workerEntryModal").classList.remove("hidden");
    }

    function adjustModalQty(itemId, delta) {
      const inp = document.getElementById(`modal-inp-${itemId}`);
      let current = parseFloat(inp.value) || 0;
      current = Math.max(0, current + delta);
      inp.value = current === 0 ? "" : (delta % 1 === 0 ? current : current.toFixed(1));
      calcModalRunningTotal();
    }

    function calcModalRunningTotal() {
      let sum = 0;
      WORK_ITEMS.forEach(item => {
        const inp = document.getElementById(`modal-inp-${item.id}`);
        const qty = parseFloat(inp?.value) || 0;
        sum += qty * (itemRates[item.id] || 0);
      });
      document.getElementById("modalRunningTotal").innerText = `₹${sum.toFixed(2)}`;
    }

    function saveCurrentWorkerModal() {
      const dt = document.getElementById("selectedDate").value;
      if (!records[dt]) records[dt] = {};

      let obj = {};
      let hasData = false;

      WORK_ITEMS.forEach(item => {
        const inp = document.getElementById(`modal-inp-${item.id}`);
        const qty = parseFloat(inp?.value) || 0;
        if (qty > 0) {
          obj[item.id] = qty;
          hasData = true;
        }
      });

      if (hasData) {
        records[dt][activeWorker] = obj;
      } else {
        delete records[dt][activeWorker];
      }

      saveRecords();
      closeWorkerModal();
      renderWorkerCards();
    }

    function closeWorkerModal() {
      document.getElementById("workerEntryModal").classList.add("hidden");
      activeWorker = null;
    }

    function updateDayHeaderSummary() {
      const dt = document.getElementById("selectedDate").value;
      const dayData = records[dt] || {};
      let total = 0;
      let activeCount = 0;

      for (const [w, items] of Object.entries(dayData)) {
        let hasItem = false;
        for (const [id, qty] of Object.entries(items)) {
          if (qty > 0) {
            total += (qty * (itemRates[id] || 0));
            hasItem = true;
          }
        }
        if (hasItem) activeCount++;
      }

      document.getElementById("headerDayTotal").innerText = `₹${total.toFixed(2)}`;
      document.getElementById("activeWorkersCount").innerText = `${activeCount} / ${WORKERS.length} Active`;
    }

    // MONTHLY REPORT
    function renderMonthlySummary() {
      const from = document.getElementById("sumFromDate").value;
      const to = document.getElementById("sumToDate").value;
      let grandTotal = 0;
      let totalRoj = 0;
      let workerSummary = {};

      WORKERS.forEach(w => workerSummary[w] = { total: 0, items: {} });

      for (const [dt, dayData] of Object.entries(records)) {
        if (dt >= from && dt <= to) {
          for (const [w, items] of Object.entries(dayData)) {
            if (workerSummary[w]) {
              for (const [itemId, qty] of Object.entries(items)) {
                const amt = qty * (itemRates[itemId] || 0);
                workerSummary[w].total
