<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily Payroll</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24">

  <!-- TOP HEADER -->
  <header class="bg-indigo-900 text-white sticky top-0 z-30 shadow-md">
    <div class="px-4 py-3 flex items-center justify-between">
      <div class="font-bold text-base tracking-wide flex items-center gap-2">
        <span>📋</span> Daily Payroll
      </div>
      <div>
        <input type="date" id="selectedDate" onchange="onDateChange()" 
               class="bg-indigo-950 text-indigo-100 text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-indigo-700 outline-none">
      </div>
    </div>
    <div class="bg-indigo-800 px-4 py-2 flex justify-between items-center text-xs border-t border-indigo-700">
      <span>Daily Total: <strong id="headerDayTotal" class="text-emerald-300 text-sm">₹0.00</strong></span>
      <span id="activeWorkersCount" class="text-indigo-200">0 Active Workers</span>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="p-3 max-w-lg mx-auto">

    <!-- VIEW 1: DAILY CARDS -->
    <section id="view-entry" class="space-y-2.5">
      <div id="workersCardList" class="space-y-2.5">
        <!-- Workers injected automatically via JS -->
      </div>
    </section>

    <!-- VIEW 2: MONTHLY REPORT -->
    <section id="view-summary" class="hidden space-y-3">
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-3">
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="text-slate-500 font-medium">From:</label>
            <input type="date" id="sumFromDate" class="w-full mt-1 border border-slate-300 rounded p-1.5 font-medium">
          </div>
          <div>
            <label class="text-slate-500 font-medium">To:</label>
            <input type="date" id="sumToDate" class="w-full mt-1 border border-slate-300 rounded p-1.5 font-medium">
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="renderMonthlySummary()" class="flex-1 bg-indigo-600 text-white font-medium text-xs py-2 rounded-lg shadow">
            Filter Report
          </button>
          <button onclick="exportCSV()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-medium">
            Export CSV
          </button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-[10px] text-slate-400 font-bold uppercase">Total Payout</div>
          <div class="text-lg font-black text-indigo-700 mt-0.5" id="sumTotalPayout">₹0.00</div>
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-[10px] text-slate-400 font-bold uppercase">Total Roj (Days)</div>
          <div class="text-lg font-black text-emerald-600 mt-0.5" id="sumTotalRoj">0</div>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div class="p-3 border-b border-slate-100 font-bold text-xs text-slate-700 flex justify-between bg-slate-50">
          <span>Worker Name</span>
          <span>Total (₹)</span>
        </div>
        <div id="summaryList" class="divide-y divide-slate-100 text-xs"></div>
      </div>
    </section>

    <!-- VIEW 3: RATE MASTER -->
    <section id="view-rates" class="hidden">
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm space-y-3">
        <div class="flex items-center justify-between pb-2 border-b border-slate-100">
          <div>
            <h2 class="font-bold text-sm">Item Rates (₹)</h2>
            <p class="text-[10px] text-slate-400">રેટ બદલવા માટે કિંમત લખી સેવ કરો.</p>
          </div>
          <button onclick="saveRatesFromUI()" class="bg-emerald-600 text-white px-3 py-1.5 text-xs rounded-lg font-bold shadow">
            Save Rates
          </button>
        </div>
        <div class="space-y-2 text-xs" id="ratesInputsList"></div>
      </div>
    </section>

  </main>

  <!-- MODAL: WORKER ENTRY (BOTTOM POPUP) -->
  <div id="workerEntryModal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col justify-end">
    <div class="bg-white rounded-t-2xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      
      <div class="p-3.5 bg-indigo-900 text-white flex items-center justify-between">
        <div>
          <span class="text-[10px] text-indigo-300 uppercase font-semibold">Worker</span>
          <h3 class="font-bold text-base leading-tight" id="modalWorkerName">WORKER</h3>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-indigo-300 font-semibold">Total ₹</div>
          <div class="text-base font-black text-emerald-300" id="modalRunningTotal">₹0.00</div>
        </div>
      </div>

      <div class="p-3 overflow-y-auto space-y-2 flex-1" id="modalItemsList"></div>

      <div class="p-3 bg-slate-50 border-t border-slate-200 flex gap-2">
        <button onclick="closeWorkerModal()" class="flex-1 bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs">
          Cancel
        </button>
        <button onclick="saveCurrentWorkerModal()" class="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs shadow">
          Save Entry
        </button>
      </div>

    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 z-40 text-xs shadow-lg">
    <button onclick="switchView('entry')" id
